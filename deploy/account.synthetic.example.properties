# Isolated synthetic accounts only. Not loaded by Compose; never use with real account data.
app.account.enabled=false
app.account.synthetic-only=true
app.account.policy-version=cross-border-v1
app.account.authorization-ttl=5m
app.account.proof-ttl=5m
app.account.request-timeout=5s
app.account.lease-duration=30s
app.account.poll-interval=2s
# Each site listens on a private address reachable from the other site (e.g. inside WireGuard).
app.account.listen-host=127.0.0.1
app.account.listen-port=9444
app.account.peer-site-id=${ACCOUNT_PEER_SITE_ID}
app.account.peer-instance-id=${ACCOUNT_PEER_INSTANCE_ID}
app.account.peer-base-url=${ACCOUNT_PEER_BASE_URL}
app.account.key-store=${ACCOUNT_KEY_STORE}
app.account.key-store-password=${ACCOUNT_KEY_STORE_PASSWORD}
app.account.trust-store=${ACCOUNT_TRUST_STORE}
app.account.trust-store-password=${ACCOUNT_TRUST_STORE_PASSWORD}
app.account.peer-certificate-sha256=${ACCOUNT_PEER_CERTIFICATE_SHA256}
# PR-04 retains its separate listener / protocol. No real business capture or file transfer.
app.sync.capture-enabled=false
app.sync.transport-enabled=false
app.sync.relation.enabled=false
app.sync.browse.enabled=false
