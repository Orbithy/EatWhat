# Loaded only via the explicit --spring.config.location argument in these Compose files.
# Credentials/endpoints come from the selected site's whitelisted container environment.
spring.application.name=eatwhat
server.port=8080

app.site.mode=${SITE_MODE}
app.site.id=${SITE_ID}
app.site.instance-id=${SITE_INSTANCE_ID}
app.storage.s3.provider=${S3_PROVIDER}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_APP_USER}
spring.datasource.password=${DB_APP_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.flyway.url=${DB_URL}
spring.flyway.user=${DB_MIGRATION_USER}
spring.flyway.password=${DB_MIGRATION_PASSWORD}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.clean-disabled=true

spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=3s
spring.data.redis.connect-timeout=3s

app.base-url=${APP_BASE_URL}
app.oauth-url=${APP_OAUTH_URL}
app.oauth-callback-url=${APP_OAUTH_CALLBACK_URL:https://v50to.you/api/callback}
app.oauth-app-success-redirect=${APP_OAUTH_APP_SUCCESS_REDIRECT:https://v50to.you/app/auth/callback}
app.jwt.key=${APP_JWT_KEY}
app.mail.from=${MAIL_FROM}
app.mail.from-name=${MAIL_FROM_NAME}
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.test-connection=false
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLED}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLED}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

sms.active=aliyun
sms.aliyun.access-key-id=${SMS_ACCESS_KEY_ID}
sms.aliyun.access-key-secret=${SMS_ACCESS_KEY_SECRET}
sms.aliyun.sign-name=${SMS_SIGN_NAME}
sms.aliyun.interval=60

# Tencent Cloud International CAPTCHA. Missing credentials block challenge sends.
app.captcha.tencent.enabled=${TENCENT_CAPTCHA_ENABLED:true}
app.captcha.tencent.app-id=${TENCENT_CAPTCHA_APP_ID:}
app.captcha.tencent.app-secret-key=${TENCENT_CAPTCHA_APP_SECRET_KEY:}
app.captcha.tencent.secret-id=${TENCENT_CAPTCHA_SECRET_ID:}
app.captcha.tencent.secret-key=${TENCENT_CAPTCHA_SECRET_KEY:}
app.captcha.tencent.session-token=${TENCENT_CAPTCHA_SESSION_TOKEN:}
app.captcha.tencent.timeout=${TENCENT_CAPTCHA_TIMEOUT:5s}
app.captcha.tencent.aid-encrypted-ttl=${TENCENT_CAPTCHA_AID_ENCRYPTED_TTL:120s}

# Preserve Sa-Token and the existing Bearer contract.
sa-token.token-prefix=Bearer
sa-token.cookie-auto-fill-prefix=true
sa-token.timeout=${SA_TOKEN_TIMEOUT}
sa-token.active-timeout=${SA_TOKEN_ACTIVE_TIMEOUT}
sa-token.is-concurrent=${SA_TOKEN_CONCURRENT}
sa-token.is-share=${SA_TOKEN_SHARE}
sa-token.is-log=false

app.storage.s3.endpoint=${S3_ENDPOINT}
app.storage.s3.region=${S3_REGION}
app.storage.s3.bucket=${S3_BUCKET}
app.storage.s3.access-key=${S3_ACCESS_KEY}
app.storage.s3.secret-key=${S3_SECRET_KEY}
app.storage.s3.path-style=true
# Explicit modes retain the private presigned origin host; this is only a public object root.
app.storage.s3.cdn-endpoint=
app.storage.s3.public-base-url=${S3_PUBLIC_BASE_URL:}
app.storage.s3.sign-get-ttl-seconds=600
app.storage.s3.sign-put-ttl-seconds=300
app.storage.s3.max-file-size-bytes=52428800
app.storage.s3.allowed-content-types=image/jpeg,image/png,image/webp
app.storage.s3.allowed-read-prefixes=${S3_ALLOWED_READ_PREFIXES}
app.storage.s3.public-read-prefixes=${S3_PUBLIC_READ_PREFIXES:}

# Local readiness depends on local DB/Redis, never on remote mail/S3/another site.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.health.mail.enabled=false
sentry.enabled=false
sentry.dsn=

# Real business capture and transport stay off. Synthetic TLS exercises use a separate explicit configuration.
app.sync.capture-enabled=false
app.sync.transport-enabled=false
# Account consent exercise is separately opt-in and restricted to isolated synthetic data.
app.account.enabled=false
app.sync.relation.enabled=false
app.sync.browse.enabled=false
app.sync.profile.enabled=false
app.sync.privacy.enabled=false
app.sync.notification.enabled=false
