# Opt-in isolated acceptance only. Fill deployment-owned absolute paths and stable identities privately.
app.cluster.enabled=false
app.cluster.coordinator=false
app.cluster.automatic-gc-enabled=true
# app.site.cluster-id=<one stable cluster UUID>
# app.site.allocation-slot=<0 authority, 1 legacy external, 2..1023 fresh sites>
# app.cluster.authority-origin=https://authority.example.invalid
# Optional fixed gateway prefix, kept separate from the root origin (default empty).
# app.cluster.authority-api-prefix=/api
# app.cluster.authority-site-id=campus
# app.cluster.authority-instance-id=<stable authority installation UUID>
# Secondary sites: use the authority database through an independently hosted,
# synchronously replicated PostgreSQL HA endpoint. A 600 password file contains
# only the dedicated narrow database role's password. Remote JDBC requires TLS
# hostname verification; do not point this at the authority application host.
# app.cluster.auth-store.enabled=true
# app.cluster.auth-store.jdbc-url=jdbc:postgresql://auth-db.example.invalid:5432/eatwhat?sslmode=verify-full&connectTimeout=5&socketTimeout=10
# app.cluster.auth-store.username=eatwhat_auth_client
# app.cluster.auth-store.password-file=/absolute/private/auth-client.password
# Coordinator only: fixed private JSON inventory, mode 600. API reload accepts no path.
# app.cluster.profiles-file=/absolute/private/cluster-profiles.json
# Example inventory entry (camelCase JSON property names):
# {"third":{"siteId":"third","instanceId":"<stable UUID>","mode":"EXTERNAL",
#   "allocationSlot":2,"origin":"https://third.internal.example.invalid",
#   "apiPrefix":"/api",
#   "tokenFile":"/absolute/private/third-node.token"}}
# All account/domain/file switches and each site's own S3 settings must be explicitly configured.
# Node tokens: separate random URL-safe values, mode 600; never send to the browser.
# Normal business routing: one stable HTTPS hostname needs no business UI changes.
# Optional sibling-host cookie sharing, HTTPS only, deployment-controlled:
# sa-token.cookie.domain=example.invalid
# sa-token.cookie.http-only=true
# sa-token.cookie.secure=true
# sa-token.cookie.same-site=Lax

# Authority process HA: same identity, PostgreSQL, Redis and lock-capable shared state directory.
# app.cluster.control-lease.enabled=true
# app.cluster.control-lease.controller-name=campus-control
# app.control.state-directory=/absolute/shared/private/control-state

# A manual-handoff standby still heartbeats and is selectable by an administrator.
# It cannot bootstrap or claim another process's expired lease.
# An explicitly assigned live holder can renew its OWN lease.
# app.cluster.control-lease.candidate=true
# app.cluster.control-lease.automatic-takeover=false

# Optional PEM CA for cluster node HTTP/account/file clients only. Hostname validation stays enabled.
# Must be an absolute private 0600 file, with no symlink components.
# app.cluster.node-ca-file=/config/authority-ca.pem
