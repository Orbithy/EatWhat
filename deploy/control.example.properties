# Opt-in control backend only; never imported by the existing Compose templates.
# Copy privately and merge explicitly into an ISOLATED acceptance configuration.
app.control.enabled=false
app.control.environment-kind=isolated-acceptance
app.control.state-directory=/absolute/private/eatwhat-control-state
# Private directory 700, each node token file 600. Never send node tokens to a browser.
app.control.nodes.campus.origin=http://127.0.0.1:18081
# Optional gateway prefix; use empty for a direct local backend connection.
# app.control.nodes.campus.api-prefix=/api
app.control.nodes.campus.site-id=campus-acceptance
app.control.nodes.campus.instance-id=11111111-1111-4111-8111-111111111111
app.control.nodes.campus.token-file=/absolute/private/campus-control.token
# Optional static recovery catalog; must match the corresponding node's real proxy configuration.
# This is available while the node is unreachable and does not prove its current state.
# app.control.nodes.campus.channels.events=60
app.control.nodes.external.origin=http://127.0.0.1:18082
app.control.nodes.external.site-id=external-acceptance
app.control.nodes.external.instance-id=22222222-2222-4222-8222-222222222222
app.control.nodes.external.token-file=/absolute/private/external-control.token
# app.control.nodes.external.channels.storage=60
# Optional LOCAL test runner. Omit both fields to keep test execution disabled.
# app.control.repository=/absolute/path/EatWhat
# app.control.java-home=/absolute/path/to/java21
# Releases are operator-registered immutable candidates. No browser path/URL input.
# app.control.releases.candidate-1.artifact=/absolute/private/releases/candidate.jar
# app.control.releases.candidate-1.sha256=REPLACE_WITH_VERIFIED_ARTIFACT_SHA256
# app.control.releases.candidate-1.acceptance-evidence-id=REPLACE_WITH_REVIEWED_RUN_ID
# Registered remote releases require HTTPS for the task-scoped management callback.
# Optional 600-permission CA PEM, frozen into each private release binding; no global trust changes.
# app.control.deployment.authority-origin=https://management.private.example
# app.control.deployment.authority-ca-file=/absolute/private/management-ca.pem

# On each test node only: enable the node endpoints with that node's own token.
app.control.node-enabled=false
# app.control.node-token-file=/absolute/private/this-node-control.token
# Byte-transparent proxies bind LOOPBACK only; no firewall/DNS modification.
# Only add targets for dedicated test services. Workers must be routed into these
# proxies separately with test-scoped DNS/network namespaces, preserving TLS SNI.
# app.control.proxies.events.listen-port=19443
# app.control.proxies.events.target-host=external-acceptance.example.invalid
# app.control.proxies.events.target-port=9443
# app.control.proxies.events.maximum-block-seconds=60

# Application rollback is automatic on target health failure; database restore remains manual.

# SSH + Compose deployment executor. Opt in only after installing remote-release.py
# and a private release.json on each EXISTING target. Default remains disabled.
app.control.deployment.enabled=false
# Production management: environment-kind=managed-deployment (no fault proxies/test runner).
# app.control.deployment.ssh-executable=/usr/bin/ssh
# app.control.deployment.known-hosts-file=/absolute/private/known_hosts
# app.control.deployment.identity-file=/absolute/private/deployment.key
# app.control.deployment.timeout-seconds=900
# Legacy target keys are campus/external. Cluster target keys are exact member siteIds.
# app.control.deployment.targets.campus.host=campus.example.invalid
# app.control.deployment.targets.campus.user=eatwhat-deploy
# app.control.deployment.targets.campus.port=22
# app.control.deployment.targets.campus.agent=/opt/eatwhat/deploy/remote-release.py
# app.control.deployment.targets.campus.config=/opt/eatwhat/deploy/release.json
# app.control.deployment.targets.campus.site-id=campus-acceptance
# app.control.deployment.targets.campus.instance-id=11111111-1111-4111-8111-111111111111
# app.control.deployment.targets.campus.current-sha256=REPLACE_WITH_RUNNING_JAR_SHA256
# app.control.deployment.targets.campus.restore-evidence-id=REPLACE_WITH_REVIEWED_RESTORE_RUN
# true blocks updating the process/container that is executing this deployment.
# app.control.deployment.targets.campus.control-host=false
# Register compatibility for every allowed running-version -> candidate transition:
# app.control.releases.candidate-1.rollback-compatible=true
# app.control.releases.candidate-1.compatible-from-sha256[0]=REPLACE_WITH_RUNNING_JAR_SHA256

# A second physical controller must use the ORIGINAL mounted shared state, never a copy.
# Require the mount in systemd before Java starts as well as this runtime guard.
# app.control.shared-state-required=true
# Optional private, immutable-for-process physical routes for original loopback SSH entries.
# Each entry binds its exact server UUID, logical host/port and ORIGINAL pinned host key.
# On a remote shared-state controller an unbound loopback entry is refused.
# app.control.servers.ssh-routes-file=/absolute/private/ssh-routes.json

# Optional operator-owned SSH key inventory (0600 JSON; HTTP exposes only id/label).
# app.control.servers.credentials-file=/opt/eatwhat-control/config/ssh-credentials.json
# Optional private node CA, restricted to node HTTP clients; JVM/system trust is unchanged.
# app.control.node-ca-file=/opt/eatwhat-control/config/authority-ca.pem
