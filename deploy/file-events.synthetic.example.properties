# Not loaded by Compose. Explicit opt-in only after both nodes have V34 and the existing account/mTLS setup.
app.sync.files.enabled=false
app.sync.files.batch-size=32
app.sync.files.poll-interval=5s
# Requires account consent, file replication and app.sync.transport-enabled=true with synthetic-only=false.
# GC and CDN workers remain independently disabled; an applied tombstone receipt is not permission to delete bytes.
