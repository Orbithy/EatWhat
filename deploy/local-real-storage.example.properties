# Copy to deploy/.env.live-storage.properties (ignored), or use an absolute private path.
# No application environment is changed. This file is only read by the opt-in test harness.
acceptance.dedicated-test-buckets=true
rustfs.endpoint=https://rustfs-test.example.invalid
rustfs.region=us-east-1
rustfs.bucket=eatwhat-acceptance-campus
rustfs.path-style=true
rustfs.credentials-file=/absolute/private/rustfs-test.credentials.properties
r2.endpoint=https://REPLACE_WITH_ACCOUNT_ID.r2.cloudflarestorage.com
r2.region=auto
r2.bucket=eatwhat-acceptance-external
r2.path-style=true
r2.credentials-file=/absolute/private/r2-test.credentials.properties
# Each credentials file contains access-key=... and secret-key=... and should be mode 600.
# Alternatively replace credentials-file with credentials-profile=<existing AWS profile name>.
# Do not point at production buckets. No buckets are created or removed by the real-store run.
