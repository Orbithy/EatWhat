# User's edge proxy preserves /api/; this gateway removes it exactly once.
server {
    listen 10.10.10.154:18091;
    allow 10.10.10.189;
    deny all;
    server_name _;
    server_tokens off;
    client_max_body_size 64m;

    # Servlet matrix parameters must not bypass reserved-path matching.
    if ($uri ~ ";") { return 400; }
    location ~* ^/api/(internal|actuator|control-ui|swagger-resources)(/|$) { return 404; }
    location ~* ^/api/admin/control(/|$) { return 404; }
    location ~* ^/api/(v3/api-docs|swagger-ui)(/|\.|$) { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:18090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Control-Node-Token "";
        proxy_set_header X-Deployment-Token "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
    location / { return 404; }
}
