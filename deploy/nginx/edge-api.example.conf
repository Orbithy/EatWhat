# Add inside your existing frontend server block. Preserve /api/ on this hop;
# the Singapore business gateway removes that prefix before the application.
# Port 443 on this origin is plain HTTP; public TLS terminates on your edge.
location /api/ {
    # Root-only fragment: proxy_set_header X-Origin-Verify "<origin value>";
    # Set it explicitly on the edge, overwriting any client-supplied value.
    # Provision the real value outside this repo before enabling the origin gate.
    include /etc/nginx/private/eatwhat-origin-verify-proxy.conf;
    proxy_pass http://51.79.204.39:443;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
