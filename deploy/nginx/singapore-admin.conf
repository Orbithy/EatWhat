# The existing edge terminates HTTPS and sends HTTP to origin port 80 or 443.
# $eatwhat_origin_verified is defined by the private map in singapore-business.conf.
server {
    listen 80;
    listen 443;
    server_name admin.v50to.you;
    server_tokens off;
    client_max_body_size 64m;

    if ($eatwhat_origin_verified = 0) { return 403; }
    if ($uri ~ ";") { return 400; }

    # Reuse the restricted control gateway's path routing and authentication.
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Control-Node-Token "";
        proxy_set_header X-Deployment-Token "";
        proxy_set_header X-Origin-Verify "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
