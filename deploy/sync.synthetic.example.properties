# Review-only supplement for an isolated SYNTHETIC exercise. Not loaded by either Compose example.
# Never point this exercise at a real business database or import production events.
app.sync.capture-enabled=false
app.sync.transport-enabled=false
app.sync.synthetic-only=true
app.sync.relation.enabled=false
app.sync.browse.enabled=false
app.sync.profile.enabled=false
app.sync.privacy.enabled=false
app.sync.notification.enabled=false

# Bind peer identity to the peer leaf certificate, separately from the local app.site.* identity.
app.sync.peer-site-id=${SYNC_PEER_SITE_ID}
app.sync.peer-instance-id=${SYNC_PEER_INSTANCE_ID}
# CAMPUS only: fixed HTTPS origin; EXTERNAL must leave this empty.
app.sync.peer-base-url=${SYNC_PEER_BASE_URL:}
app.sync.peer-certificate-sha256=${SYNC_PEER_CERT_SHA256}
app.sync.key-store=${SYNC_KEY_STORE}
app.sync.key-store-password=${SYNC_KEY_STORE_PASSWORD}
app.sync.trust-store=${SYNC_TRUST_STORE}
app.sync.trust-store-password=${SYNC_TRUST_STORE_PASSWORD}

# EXTERNAL only. No listener is created on CAMPUS. Paths are /internal/sync/v1/{push,pull,ack}.
app.sync.listen-host=127.0.0.1
app.sync.listen-port=9443
app.sync.request-timeout=5s
app.sync.lease-duration=30s
app.sync.poll-interval=5s
app.sync.retry-base=1s
app.sync.retry-max=60s
