spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/DBname
    username:
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true

  mail:
    host:          # SMTP服务器地址
    port: 465      # SMTP端口，587为TLS端口，465为SSL端口
    username:     # SMTP登录用户名（登录凭据）
    password:    # SMTP登录密码或授权码
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        properties:
          mail:
            debug: true

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 10s
      lettuce:
        pool:
          # 连接池最大连接数
          max-active: 200
          # 连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms
          # 连接池中的最大空闲连接
          max-idle: 10
          # 连接池中的最小空闲连接
          min-idle: 0

sa-token:
  timeout: -1
  active-timeout: 259200      # 3天无操作下线
  is-concurrent: false
  is-share: false
  token-prefix: Bearer
  cookie-auto-fill-prefix: true

sms:
  active: aliyun
  aliyun:
    access-key-id:
    access-key-secret:
    sign-name: "速通互联验证码"
    interval: 60

app:
  base-url: https://example.com  # 应用基础URL，用于生成邮箱验证链接，生产环境需要替换为实际域名
  mail:
    from: noreply@example.com      # 发件人邮箱地址，需要替换为实际的发件邮箱
    from-name: project name             # 发件人名称
  oauth-url: https://i.sdu.edu.cn/cas/proxy/login/page?forward=https%3A%2F%2Fv50to.you%2Fapi%2Fcallback  # 统一认证地址；forward 会被替换成带一次性 state 的回跳地址
  oauth-callback-url: https://v50to.you/api/callback  # 回跳地址前缀；后端自动追加一次性 /{state}
  # oauth-success-redirect: /home                         # 可选，认证成功后浏览器跳到哪里
  oauth-app-success-redirect: https://v50to.you/app/auth/callback  # client=app 的成功回跳；App 收到链接后查询认证结果
  # auth:
  #   username-registration-enabled: false               # 默认关闭用户名加密码注册，新用户只能用手机号验证码注册
  jwt:
    key: ${JWT_SECRET}
  storage:
    s3:
      endpoint: ${S3_ENDPOINT:https://sgp1.digitaloceanspaces.com}
      cdn-endpoint: ${S3_CDN_ENDPOINT:https://sgp1.cdn.digitaloceanspaces.com}
      region: sg
      bucket: sdueatwhat
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
      path-style: ${S3_PATH_STYLE:true}
      sign-get-ttl-seconds: ${S3_SIGN_GET_TTL:600}
      sign-put-ttl-seconds: ${S3_SIGN_PUT_TTL:300}
      max-file-size-bytes: ${S3_MAX_FILE_SIZE:52428800}
      allowed-content-types:
        - image/jpeg
        - image/png
        - image/webp
        - image/gif
      allowed-read-prefixes:
        - restaurants/
        - activity/
        - avatar/
        - foods/
      public-read-prefixes:
        - avatar/
    files:
      lifecycle-enabled: ${FILE_LIFECYCLE_ENABLED:false}
      legacy-read-enabled: ${FILE_LEGACY_READ_ENABLED:true}
      # Per-user presign limits (0 = unlimited, the default). Soft, best-effort checks on the database clock.
      max-open-intents-per-user: ${FILE_MAX_OPEN_INTENTS_PER_USER:0}      # intents neither completed nor expired
      max-bytes-per-hour-per-user: ${FILE_MAX_BYTES_PER_HOUR_PER_USER:0}  # declared bytes created in the last hour
      gc:
        # Report-only inventory (never deletes). safety-window must be >= 15m and >= intent/presign TTLs.
        inventory-enabled: ${FILE_GC_INVENTORY_ENABLED:false}
        interval: 1h
        page-size: 500
        safety-window: 1h
        verified-prefix: verified/
        staging-prefix: staging/
        replica-check-batch: 200
        # Physical GC (stage 07C) is OFF by default. enabled=true (candidate detection, dry-run evaluation and the
        # "file-gc" loop) requires inventory-enabled=true; inventory-enabled alone only runs the report-only inventory.
        enabled: ${FILE_GC_ENABLED:false}
        # Deleting requires ALL of: enabled=true, execute-enabled=true, dry-run=false, app.site.mode=CAMPUS, a non-blank execute-ack
        # (id of a signed restore drill, never logged) and the object class listed in execute-classes. Replicated
        # revisions require coordinated-enabled and both sites' durable prepare/commit decisions.
        # EXTERNAL may execute only UNREFERENCED_REVISION with coordination enabled; each site deletes its LOCAL store.
        retention: 30d            # time a revision stays unreferenced before it may be deleted (minimum 7d)
        dry-run: ${FILE_GC_DRY_RUN:true}
        execute-enabled: ${FILE_GC_EXECUTE_ENABLED:false}
        coordinated-enabled: ${FILE_GC_COORDINATED_ENABLED:false} # requires app.sync.files.enabled and gc.enabled
        execute-ack: ${FILE_GC_EXECUTE_ACK:}
        # execute-classes: STAGING,ORPHAN_CANDIDATE,UNREFERENCED_REVISION,STALE_MULTIPART   # allowed values; empty by default
        # STALE_MULTIPART aborts abandoned multipart uploads (delete-class: same gates, per-run cap shared with deletes).
        # The inventory reports such uploads (finding kind STALE_MULTIPART) as soon as it runs; nothing is aborted without it.
        multipart-ttl: 24h        # >= 1h; an upload must also be older than safety-window and owned by no READY/LEASED job or open intent
        max-deletes-per-run: 100  # 1..1000
        gc-interval: 1h           # >= 1m
        claim-lease: 5m           # 60s..15m
      # CDN invalidation queue (stage 07D). The database enqueues one REVOKE task when the last live reference of a
      # revision that once had a PUBLIC reference is released. The worker is OFF by default, so those tasks stay READY and
      # the GC keeps such revisions (CDN_INVALIDATION_PENDING). NOOP marks tasks SKIPPED/NO_PROVIDER (releases the GC);
      # WEBHOOK POSTs {taskId, reason, paths, timestamp} (CDN-relative paths only) with an X-Signature HMAC-SHA256 header.
      cdn-invalidation:
        enabled: ${FILE_CDN_INVALIDATION_ENABLED:false}
        provider: ${FILE_CDN_INVALIDATION_PROVIDER:NOOP}   # NOOP | WEBHOOK
        # webhook-url: https://hooks.example.invalid/cdn   # https, no credentials/query in the URL
        # webhook-secret: ${FILE_CDN_WEBHOOK_SECRET}       # required for WEBHOOK; never logged
        timeout: 10s              # 1s..2m
        batch: 8                  # 1..100
        lease: 2m                 # 30s..15m, longer than timeout
        retry-base: 5s
        retry-max: 30m
        jitter: 0.2               # 0.0..0.5
        poll-interval: 5s         # >= 100ms
        alert-after-attempts: 50  # one alert, the task keeps retrying
      replication:
        enabled: ${FILE_REPLICATION_ENABLED:false}
        worker-enabled: ${FILE_REPLICATION_WORKER_ENABLED:false}
        cdn-output-enabled: ${FILE_REPLICATION_CDN_OUTPUT_ENABLED:false}
        lease-seconds: 120
        batch: 8
        poll-interval: 5s
        retry-base: 5s
        retry-max: 30m
        jitter: 0.2
        alert-after-attempts: 50
        temp-dir: ${TEMP_DIR:}
        verify-mode: FULL_READBACK
        # Large objects are copied with S3 multipart (parts stream from the temp file; memory does not grow with size).
        multipart-threshold: 16777216   # bytes; objects >= this use multipart (must be >= part-size)
        part-size: 8388608              # bytes, 5 MiB..1 GiB; app.storage.s3.max-file-size-bytes / part-size must be <= 10000
        temp-reserve-bytes: 67108864    # free space that must remain in temp-dir after the download (0 = no reserve)
        max-bytes-per-second: 0         # throughput cap per object store; 0 = unlimited
        peer:
          endpoint: ${PEER_ENDPOINT:}
          region: ${PEER_REGION:}
          bucket: ${PEER_BUCKET:}
          access-key: ${PEER_ACCESS_KEY:}
          secret-key: ${PEER_SECRET_KEY:}
          path-style: ${PEER_PATH_STYLE:false}
          cdn-base-url: ${PEER_CDN_BASE_URL:}

sentry:
  dsn:
  # Add data like request headers and IP for users,
  # see https://docs.sentry.io/platforms/java/guides/spring-boot/data-management/data-collected/ for more info
  send-default-pii: true
  # Set traces_sample_rate to 1.0 to capture 100% of transactions.
  # We recommend adjusting this value in production.
  traces-sample-rate: 1.0
