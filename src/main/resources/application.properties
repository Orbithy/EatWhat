spring.application.name=eatwhat

# Tencent Cloud International CAPTCHA. Missing credentials block challenge sends.
app.captcha.tencent.enabled=${TENCENT_CAPTCHA_ENABLED:true}
app.captcha.tencent.app-id=${TENCENT_CAPTCHA_APP_ID:}
app.captcha.tencent.app-secret-key=${TENCENT_CAPTCHA_APP_SECRET_KEY:}
app.captcha.tencent.secret-id=${TENCENT_CAPTCHA_SECRET_ID:}
app.captcha.tencent.secret-key=${TENCENT_CAPTCHA_SECRET_KEY:}
app.captcha.tencent.session-token=${TENCENT_CAPTCHA_SESSION_TOKEN:}
app.captcha.tencent.timeout=${TENCENT_CAPTCHA_TIMEOUT:5s}
app.captcha.tencent.aid-encrypted-ttl=${TENCENT_CAPTCHA_AID_ENCRYPTED_TTL:120s}
