# Loaded explicitly by ApplicationRecoveryIT. Never import application.yml or host config.
spring.application.name=eatwhat-isolated-integration
server.address=127.0.0.1
server.port=0
logging.config=classpath:logback-test.xml
spring.autoconfigure.exclude=work.foofish.smsverify.SmsAutoConfiguration

# Fail closed until DynamicPropertySource replaces these with test-owned random ports.
spring.datasource.url=jdbc:postgresql://127.0.0.1:1/never_connect
spring.datasource.username=synthetic
spring.datasource.password=synthetic
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-timeout=2000
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.clean-disabled=true
spring.data.redis.host=127.0.0.1
spring.data.redis.port=1
spring.data.redis.database=0
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms

sa-token.token-name=eatwhat-test-token
sa-token.token-prefix=Bearer
sa-token.timeout=600
sa-token.active-timeout=300
sa-token.is-concurrent=false
sa-token.is-share=false
sa-token.is-log=false

# These boundaries are Mockito replacements in the integration context.
spring.mail.host=mail.example.invalid
spring.mail.test-connection=false
app.mail.from=integration@example.invalid
app.mail.from-name=EatWhat integration
app.base-url=https://application.example.invalid
app.oauth-url=https://identity.example.invalid
app.jwt.key=synthetic-integration-only-not-a-real-key
app.storage.s3.endpoint=https://storage.example.invalid
app.storage.s3.cdn-endpoint=https://cdn.example.invalid
app.storage.s3.region=us-east-1
app.storage.s3.bucket=synthetic-integration
app.storage.s3.access-key=synthetic
app.storage.s3.secret-key=synthetic
sentry.dsn=
sentry.enabled=false
management.endpoints.web.exposure.include=health
# The mail boundary is a Mockito bean, not a configured SMTP transport or health probe.
management.health.mail.enabled=false
